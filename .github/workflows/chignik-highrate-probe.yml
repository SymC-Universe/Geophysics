name: Chignik high-rate transport probe

on:
  workflow_dispatch:
  push:
    paths:
      - "investigations/chignik_2021/**"
      - ".github/workflows/chignik-highrate-probe.yml"

permissions:
  contents: read

jobs:
  transport-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests numpy scipy

      - name: Run Chignik transport probe
        run: python investigations/chignik_2021/highrate_transport_probe.py

      - name: Show probe summary
        if: always()
        run: |
          if [ -f artifacts/chignik_highrate_probe/SUMMARY.md ]; then
            cat artifacts/chignik_highrate_probe/SUMMARY.md
          else
            echo "Probe did not produce SUMMARY.md"
          fi

      - name: Upload probe artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chignik-highrate-probe
          path: artifacts/chignik_highrate_probe/
          if-no-files-found: warn
          retention-days: 14
