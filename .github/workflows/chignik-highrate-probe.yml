name: Geophysics benchmark probes

on:
  workflow_dispatch:
  push:
    paths:
      - "investigations/chignik_2021/**"
      - "investigations/multievent_benchmark_2026/**"
      - "investigations/volcano_earthquake_coupling_2026/**"
      - ".github/workflows/chignik-highrate-probe.yml"

permissions:
  contents: read

jobs:
  transport-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests numpy scipy

      - name: Run Chignik transport probe
        run: python investigations/chignik_2021/highrate_transport_probe.py

      - name: Run multi-event open-data probe
        run: python investigations/multievent_benchmark_2026/open_data_availability_probe.py

      - name: Run volcano open-data probe
        run: python investigations/volcano_earthquake_coupling_2026/volcano_open_data_probe.py

      - name: Run volcano waveform-access probe
        run: python investigations/volcano_earthquake_coupling_2026/volcano_waveform_access_probe.py

      - name: Show probe summaries
        if: always()
        run: |
          if [ -f artifacts/chignik_highrate_probe/SUMMARY.md ]; then
            cat artifacts/chignik_highrate_probe/SUMMARY.md
          else
            echo "Chignik probe did not produce SUMMARY.md"
          fi
          if [ -f artifacts/multievent_benchmark_2026/AVAILABILITY_SUMMARY.md ]; then
            cat artifacts/multievent_benchmark_2026/AVAILABILITY_SUMMARY.md
          else
            echo "Multi-event probe did not produce AVAILABILITY_SUMMARY.md"
          fi
          if [ -f artifacts/volcano_earthquake_coupling_2026/VOLCANO_AVAILABILITY_SUMMARY.md ]; then
            cat artifacts/volcano_earthquake_coupling_2026/VOLCANO_AVAILABILITY_SUMMARY.md
          else
            echo "Volcano probe did not produce VOLCANO_AVAILABILITY_SUMMARY.md"
          fi

      - name: Upload Chignik probe artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chignik-highrate-probe
          path: artifacts/chignik_highrate_probe/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload multi-event availability artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multievent-data-availability
          path: artifacts/multievent_benchmark_2026/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload volcano availability artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: volcano-data-availability
          path: artifacts/volcano_earthquake_coupling_2026/
          if-no-files-found: warn
          retention-days: 14
